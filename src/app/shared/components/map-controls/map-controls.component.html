<!-- Floating toolbar on the right edge of the map. -->
<div class="map-controls-toolbar" #toolbar>
  <!-- Zoom and orientation, grouped in a single white panel. -->
  <div
    class="map-controls-group"
    role="group"
    aria-label="Zoom and orientation"
  >
    <button
      type="button"
      class="map-controls-button"
      title="Zoom in"
      aria-label="Zoom in"
      (click)="zoomIn()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M12 5v14M5 12h14" />
      </svg>
    </button>

    <button
      type="button"
      class="map-controls-button"
      title="Zoom out"
      aria-label="Zoom out"
      (click)="zoomOut()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M5 12h14" />
      </svg>
    </button>

    <button
      type="button"
      class="map-controls-button map-controls-compass"
      title="Reset bearing to north"
      aria-label="Reset bearing to north"
      (click)="resetNorth()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="9" />
        <g [style.transform]="'rotate(' + -bearing + 'deg)'">
          <path
            d="M12 4.6l3.2 8.6-3.2-1.9-3.2 1.9z"
            fill="currentColor"
            stroke="none"
          />
        </g>
      </svg>
    </button>
  </div>

  <!-- The measurement tools, grouped in their own white panel. -->
  <div
    class="map-controls-group map-controls-group--measure"
    *ngIf="draw"
    role="group"
    aria-label="Measurements"
  >
    <button
      type="button"
      class="map-controls-button"
      [class.is-active]="activeDrawMode === 'draw_polygon'"
      title="Measure area"
      aria-label="Measure area"
      [attr.aria-pressed]="activeDrawMode === 'draw_polygon'"
      (click)="toggleDraw('draw_polygon')"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path
          d="M5.5 6.2l7-3.4 7.6 4.6-1.6 8.4-8.6 3.2-5-6.4z"
          stroke-dasharray="3 2.4"
        />
      </svg>
    </button>

    <button
      type="button"
      class="map-controls-button"
      [class.is-active]="activeDrawMode === 'draw_line_string'"
      title="Measure distance"
      aria-label="Measure distance"
      [attr.aria-pressed]="activeDrawMode === 'draw_line_string'"
      (click)="toggleDraw('draw_line_string')"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path
          d="M2.9 14.2l7.6-7.6a1 1 0 0 1 1.4 0l6.1 6.1a1 1 0 0 1 0 1.4l-7.6 7.6a1 1 0 0 1-1.4 0l-6.1-6.1a1 1 0 0 1 0-1.4z"
        />
        <path d="M7.3 11.1l1.8 1.8M10.2 8.2l1.8 1.8M13.1 5.3l1.8 1.8" />
      </svg>
    </button>

    <button
      type="button"
      class="map-controls-button map-controls-button--clear"
      title="Clear measurements"
      aria-label="Clear measurements"
      (click)="clearDrawings()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M4 7h16" />
        <path d="M6.5 7l.9 11.2a2 2 0 0 0 2 1.8h5.2a2 2 0 0 0 2-1.8L17.5 7" />
        <path
          d="M9.5 7V5.4a1.9 1.9 0 0 1 1.9-1.9h1.2a1.9 1.9 0 0 1 1.9 1.9V7"
        />
        <path d="M10.3 10.6v6M13.7 10.6v6" />
      </svg>
    </button>
  </div>

  <!-- The other map actions, as individual floating buttons. -->
  <div class="map-controls-stack">
    <button
      type="button"
      class="map-controls-button"
      title="Show my location"
      aria-label="Show my location"
      *ngIf="geolocateControl"
      (click)="locateUser()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="7" />
        <circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none" />
        <path d="M12 1.8v2.6M12 19.6v2.6M1.8 12h2.6M19.6 12h2.6" />
      </svg>
    </button>

    <button
      type="button"
      class="map-controls-button map-controls-button--style"
      [class.is-active]="panelOpen"
      [attr.title]="
        lightingSelection === 'auto'
          ? 'Map style — Automatic lighting enabled'
          : 'Map style'
      "
      [attr.aria-label]="
        lightingSelection === 'auto'
          ? 'Map style — Automatic lighting enabled'
          : 'Map style'
      "
      [attr.aria-expanded]="panelOpen"
      (click)="togglePanel()"
      (pointerenter)="onStyleButtonEnter($event)"
      (pointerleave)="onStyleButtonLeave($event)"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M12 3l9 5-9 5-9-5 9-5z" />
        <path d="M3 12.5l9 5 9-5" />
      </svg>
      <span
        class="map-controls-auto-badge"
        *ngIf="lightingSelection === 'auto'"
        aria-hidden="true"
        >A</span
      >
    </button>
  </div>
</div>

<!-- Map style panel, anchored in the bottom-right corner. -->
<section
  class="map-controls-panel"
  *ngIf="panelOpen"
  aria-label="Map style"
  (pointerenter)="onPanelEnter($event)"
  (pointerleave)="onPanelLeave($event)"
>
  <div class="map-controls-panel__header">
    <h2 class="map-controls-panel__title">Map style</h2>
    <button
      type="button"
      class="map-controls-panel__toggle"
      title="Collapse map style panel"
      aria-label="Collapse map style panel"
      (click)="togglePanel()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M6 9l6 6 6-6" />
      </svg>
    </button>
  </div>

  <div class="map-controls-styles">
    <button
      type="button"
      class="map-controls-style"
      *ngFor="let option of styleOptions"
      [class.is-selected]="selectedStyle === option.value"
      [attr.aria-pressed]="selectedStyle === option.value"
      [attr.aria-label]="option.label + (option.isNew ? ' (new)' : '')"
      (click)="selectStyle(option.value)"
    >
      <span class="map-controls-style__preview">
        <!-- A screenshot of the basemap itself. The name below the picture
             already says which style it is, so the picture is decoration. -->
        <img [src]="option.preview" alt="" loading="lazy" />
        <!-- The badge repeats what the label of the button already says, so it
             is left out of the name of the button. -->
        <span
          class="map-controls-style__badge"
          *ngIf="option.isNew"
          aria-hidden="true"
          >New</span
        >
      </span>
      <span class="map-controls-style__label">{{ option.label }}</span>
    </button>
  </div>

  <hr class="map-controls-divider" />

  <div class="map-controls-panel__header">
    <!-- <h2 class="map-controls-panel__title">Lighting</h2> -->
    <span class="map-controls-status" [class.is-disabled]="!lightingEnabled">{{
      lightingStatus
    }}</span>
  </div>

  <div class="map-controls-lighting" [class.is-disabled]="!lightingEnabled">
    <button
      type="button"
      class="map-controls-lighting__option"
      *ngFor="let option of lightingOptions"
      [class.is-selected]="lightingSelection === option.value"
      [disabled]="!lightingEnabled"
      [attr.aria-pressed]="lightingSelection === option.value"
      [title]="option.label"
      (click)="selectLighting(option.value)"
    >
      <span class="map-controls-lighting__icon" [ngSwitch]="option.value">
        <!-- Auto: a clock, for the Philippine-Time schedule. -->
        <svg
          *ngSwitchCase="'auto'"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="8.5" />
          <path d="M12 7v5.2l3.4 2" />
        </svg>

        <!-- Dawn: the sun coming up. -->
        <svg
          *ngSwitchCase="'dawn'"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M7.5 16a4.5 4.5 0 0 1 9 0" />
          <path d="M2.5 18h19" />
          <path d="M12 3.5v3.2M9.8 5.4L12 3.2l2.2 2.2" />
        </svg>

        <!-- Day: the sun at its highest. -->
        <svg
          *ngSwitchCase="'day'"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2.6v2.6M12 18.8v2.6M2.6 12h2.6M18.8 12h2.6M5.4 5.4l1.9 1.9M16.7 16.7l1.9 1.9M18.6 5.4l-1.9 1.9M7.3 16.7l-1.9 1.9"
          />
        </svg>

        <!-- Dusk: the sun going down. -->
        <svg
          *ngSwitchCase="'dusk'"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M7.5 16a4.5 4.5 0 0 1 9 0" />
          <path d="M2.5 18h19" />
          <path d="M12 7.7V4.5M9.8 5.8L12 8l2.2-2.2" />
        </svg>

        <!-- Night: the moon. -->
        <svg
          *ngSwitchCase="'night'"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M20.5 14.8A8.6 8.6 0 0 1 9.2 3.5a8.6 8.6 0 1 0 11.3 11.3z" />
        </svg>
      </span>
      <span class="map-controls-lighting__label">{{ option.label }}</span>
    </button>
  </div>
</section>
