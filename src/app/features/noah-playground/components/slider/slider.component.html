<div class="slider-control">
  <div class="slider-control__header">
    <div class="slider-control__label">{{ label }}</div>
    <div class="slider-control__value">{{ sliderCtrl.value }}%</div>
  </div>
  <input
    class="slider-control__range"
    type="range"
    [min]="min"
    [max]="max"
    [step]="step"
    [formControl]="sliderCtrl"
    [value]="initialValue"
  />
</div>
