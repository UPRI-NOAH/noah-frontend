<div class="pl-3">
  <div class="flex items-center">
    <div class="inline-flex items-center radio">
      <input
        type="radio"
        class="radio h-5 w-5 text-blue-600"
        id="selected-weather-satellite-{{ name }}"
        [checked]="(selectedWeatherSatellite$ | async) === name"
        (click)="selectWeatherSatellite(name)"
      />
    </div>
    <div class="flex flex-col ml-3">
      <label
        for="selected-weather-satellite-{{ name }}"
        class="text-lg f-f-r capitalize"
        >{{ displayName }}</label
      >
      <span
        *ngIf="name === 'himawari' || name === 'himawari-GSMAP'"
        class="text-sm"
      >
        <section>
          <p class="italic text-xs tracking-wide mb-2">
            <span class="font-bold">Source:</span>
            <a
              href="https://www.eorc.jaxa.jp/ptree/"
              target="_blank"
              class="text-primary"
            >
              JAXA Himawari Monitor P-Tree System
            </a>
          </p>
        </section>
      </span>
    </div>
  </div>
  <div class="flex items-center pt-2">
    <noah-slider
      label="Opacity"
      [initialValue]="initialOpacityValue"
      [min]="0"
      [max]="100"
      (valueChange)="changeOpacity($event)"
    ></noah-slider>
  </div>
</div>
