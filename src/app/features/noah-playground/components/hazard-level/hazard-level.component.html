<div class="hazard-level-card">
  <div class="hazard-level-card__header">
    <label class="inline-flex items-center checkbox">
      <input
        [checked]="shown"
        (click)="toggleShown()"
        type="checkbox"
        class="checkbox h-5 w-5 text-blue-600"
      />
    </label>
    <div class="hazard-level-card__title">
      <div class="hazard-level-card__name">{{ name }}</div>
      <div
        class="hazard-level-card__note"
        *ngIf="
          id === 'storm-surge-advisory-1' ||
          id === 'storm-surge-advisory-2' ||
          id === 'storm-surge-advisory-3' ||
          id === 'storm-surge-advisory-4'
        "
      >
        <span *ngIf="id === 'storm-surge-advisory-1'">
          Storm Surge Height up to 2 meters
        </span>
        <span *ngIf="id === 'storm-surge-advisory-2'">
          Storm Surge Height up to 3 meters
        </span>
        <span *ngIf="id === 'storm-surge-advisory-3'">
          Storm Surge Height up to 4 meters
        </span>
        <span *ngIf="id === 'storm-surge-advisory-4'">
          Storm Surge Height more than 4 meters
        </span>
      </div>
    </div>
  </div>

  <div class="hazard-level-card__section">
    <noah-slider
      label="Opacity"
      [initialValue]="initialOpacityValue"
      (valueChange)="changeOpacity($event)"
    ></noah-slider>
  </div>

  <div class="hazard-level-card__section">
    <noah-hazard-legend
      [selectedColor]="initialColorValue"
      [customPalette]="initialCustomPalette"
      [highOnly]="highOnly"
      [typeLabel]="legendTypeLabel"
      (valueChange)="changeColor($event)"
    ></noah-hazard-legend>
  </div>
</div>
