<div class="volcano-layer mb-3 {{ volcanoType }}">
  <div class="volcano-layer__heading">
    <div class="volcano-layer__checkbox">
      <input
        type="checkbox"
        [checked]="shown"
        (click)="toggleShown()"
        name="input-{{ volcanoType }}"
      />
    </div>
    <div class="volcano-layer__title">
      {{ volcanoType | replace: '-':' ' | titlecase }}
    </div>
  </div>

  <div class="volcano-layer__slider">
    <noah-slider
      label="Opacity"
      [initialValue]="initialOpacityValue"
      (valueChange)="changeOpacity($event)"
    ></noah-slider>
  </div>

  <div class="volcano-layer__legend">
    <div class="volcano-layer__legend-title">Legend</div>
    <div class="volcano-layer__legend-row">
      <img
        class="volcano-layer__legend-icon"
        src="assets/map-sprites/{{ volcanoType }}.png"
        alt=""
      />
      <div class="volcano-layer__legend-label">{{ displayName }}</div>
    </div>
  </div>
</div>
