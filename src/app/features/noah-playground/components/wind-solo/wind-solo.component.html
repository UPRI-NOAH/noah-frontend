<div class="wl-section">
  <div class="wl-eyebrow-row">
    <div class="wl-eyebrow">FORECAST TODAY + 5 Days</div>
    <div class="wl-day-index">
      {{ currentDayIndex + 1 }} / {{ forecastDays.length }}
    </div>
  </div>

  <div class="wl-timeline">
    <div class="wl-rail">
      <div class="wl-rail-fill" [style.width.%]="timelineProgress"></div>
    </div>
    <div class="wl-days">
      <button
        *ngFor="let day of forecastDays; let i = index"
        class="wl-day"
        [class.active]="i === currentDayIndex"
        (click)="selectForecastDay(day.value)"
      >
        <div class="wl-dot"></div>
        <div class="wl-day-label">{{ day.label }}</div>
      </button>
    </div>
  </div>

  <div class="wl-play-row">
    <button class="wl-play-btn" (click)="togglePlay()">
      <svg
        *ngIf="!playing"
        viewBox="0 0 24 24"
        width="11"
        height="11"
        fill="currentColor"
      >
        <polygon points="6,4 20,12 6,20" />
      </svg>
      <svg
        *ngIf="playing"
        viewBox="0 0 24 24"
        width="11"
        height="11"
        fill="currentColor"
      >
        <rect x="5" y="4" width="5" height="16" />
        <rect x="14" y="4" width="5" height="16" />
      </svg>
      <span>{{ playing ? 'Pause' : 'Animate' }}</span>
    </button>
  </div>

  <div class="wl-controls">
    <noah-slider
      label="Particle Count"
      [initialValue]="initialParticleCountValue"
      [min]="100"
      [max]="1500"
      [step]="50"
      (valueChange)="changeParticleCount($event)"
    ></noah-slider>

    <noah-slider
      label="Speed"
      [initialValue]="initialSpeedValue"
      [min]="0.05"
      [max]="2"
      [step]="0.05"
      (valueChange)="changeSpeed($event)"
    ></noah-slider>

    <div class="wl-color-row">
      <label class="wl-color-label">Pick a color:</label>
      <input
        type="color"
        [value]="initialColorValue"
        (input)="changeColor($any($event.target).value)"
        class="wl-color-input"
      />
    </div>
  </div>
</div>
