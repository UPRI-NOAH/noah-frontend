<div class="hazard-legend">
  <div class="hazard-legend__group">
    <div class="hazard-legend__title">{{ typeLabel }} Risk Legend</div>
    <div class="hazard-legend__levels">
      <div class="hazard-legend__chip" *ngFor="let level of levels">
        <span
          class="hazard-legend__swatch hazard-legend__swatch--small"
          [ngStyle]="{ 'background-color': getColor(selectedColor, level) }"
        ></span>
        <span class="hazard-legend__level-name">{{ level }}</span>
      </div>
    </div>
  </div>

  <div class="hazard-legend__group">
    <div class="hazard-legend__title">Color Scheme</div>
    <div class="hazard-legend__palette">
      <button
        class="hazard-legend__swatch-button"
        *ngFor="let noahColor of noahColors"
        [ngStyle]="{ 'background-color': getColor(noahColor, 'high') }"
        [class.selected]="selectedColor === noahColor"
        (click)="this.selectColor(noahColor)"
        type="button"
      >
        <span class="hazard-legend__check" *ngIf="selectedColor === noahColor"
          >✓</span
        >
      </button>
      <label
        class="hazard-legend__swatch-button hazard-legend__custom"
        [class.selected]="selectedColor === customColor"
        [ngStyle]="{
          'background-color':
            selectedColor === customColor ? getColor(customColor, 'high') : ''
        }"
      >
        <span class="hazard-legend__custom-plus">+</span>
        <input
          class="sr-only"
          type="color"
          [value]="customPalette.high"
          (input)="updateCustomColor($event)"
        />
      </label>
    </div>
  </div>
</div>
