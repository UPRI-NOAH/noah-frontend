<div class="text-m f-f-r py-2">
  <div class="facility__header">
    <label class="facility__checkbox">
      <input
        type="checkbox"
        class="checkbox h-5 w-5 text-blue-600"
        [checked]="shown"
        (click)="toggleShown()"
      />
    </label>
    <div class="text-lg f-f-r capitalize">{{ displayName }}</div>
  </div>

  <div class="facility__slider">
    <noah-slider
      label="Opacity"
      [initialValue]="initialOpacityValue"
      (valueChange)="changeOpacity($event)"
    ></noah-slider>
  </div>

  <div class="flex items-center pt-2 ml-8">
    <div class="text-lg f-f-r mr-2">Legend:</div>
    <label class="inline-flex items-center">
      <img src="assets/map-sprites/{{ name }}.png" />
    </label>
    <div class="text-m leading-none capitalize ml-3">{{ displayName }}</div>
  </div>
</div>
