<div id="map"></div>
<canvas #windCanvas id="wind-canvas"></canvas>

<div id="distance" class="distance-container"></div>
<div id="area" class="area-container my-2"></div>
<pre id="coordinates" class="coords"></pre>

<div
  id="graph-dom"
  hidden
  class="
    relative
    overflow-hidden
    z-100
    text-left
    w-full
    h-auto
    sm:w-[600px] sm:h-[300px]
    lg:w-[950px] lg:h-[450px]
  "
  style="-webkit-tap-highlight-color: rgba(0, 0, 0, 0); user-select: none"
></div>

<div
  class="
    map-icon
    absolute
    z-10
    right-0
    pl-0.5
    flex flex-row
    items-center
    py-1.5
  "
>
  <!-- Day/dusk/night lighting presets (Mapbox Standard basemap only).
       Desktop: always-visible row beside the style button. On mobile these
       move to a toggle under the search bar (see below). -->
  <div
    *ngIf="mapStyle === 'standard'"
    class="hidden mr-1 overflow-hidden rounded shadow md:flex md:flex-row"
  >
    <button
      *ngFor="let preset of basemapPresets"
      type="button"
      class="
        bg-white
        px-2
        py-1.5
        text-xs
        font-semibold
        text-gray-800
        transition
        duration-150
        ease-in-out
        hover:bg-gray-200
      "
      [class.bg-gray-300]="currentBasemap === preset.value"
      [attr.aria-pressed]="currentBasemap === preset.value"
      (click)="switchBasemap(preset.value)"
    >
      {{ preset.label }}
    </button>
  </div>
  <div class="p-2">
    <div class="dropdown inline-block relative">
      <button
        class="
          bg-white
          base-icon
          text-gray-800
          font-semibold
          py-1.5
          px-1.5
          ml-2
          inline-flex
          items-center
          hover:bg-gray-200
          focus:outline-none
          focus:ring-2
          focus:ring-gray-600
          focus:ring-opacity-50
        "
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"
          />
        </svg>
      </button>
      <ul
        class="
          dropdown-menu
          rounded-lg
          shadow-2xl
          drop-shadow-xl
          bg-white
          right-10
          bottom-0
          absolute
          hidden
          text-sm text-gray-700
        "
      >
        <li class="">
          <a
            class="
              rounded-lg
              block
              px-4
              py-2
              text-sm
              leading-5
              text-gray-700
              transition
              duration-150
              ease-in-out
              hover:bg-gray-100
              focus:outline-none focus:bg-gray-100
            "
            role="button"
            (click)="switchMapStyle('standard')"
            >Standard</a
          >
        </li>
        <li class="">
          <a
            class="
              rounded-lg
              block
              px-4
              py-2
              text-sm
              leading-5
              text-gray-700
              transition
              duration-150
              ease-in-out
              hover:bg-gray-100
              focus:outline-none focus:bg-gray-100
            "
            role="button"
            (click)="switchMapStyle('terrain')"
            >Terrain</a
          >
        </li>
        <li class="">
          <a
            class="
              rounded-lg
              block
              px-4
              py-2
              text-sm
              leading-5
              text-gray-700
              transition
              duration-150
              ease-in-out
              hover:bg-gray-100
              focus:outline-none focus:bg-gray-100
            "
            role="button"
            (click)="switchMapStyle('satellite')"
            >Satellite</a
          >
        </li>
      </ul>
    </div>
  </div>
</div>

<!-- Mobile: lighting preset toggle, under the search bar at the top-left.
     Expands to show the Dawn / Day / Dusk / Night buttons. -->
<div *ngIf="mapStyle === 'standard'" class="fixed z-30 top-14 left-2 md:hidden">
  <button
    type="button"
    class="base-icon bg-white text-gray-800 rounded p-2 focus:outline-none"
    [attr.aria-expanded]="isBasemapMenuOpen"
    aria-label="Toggle lighting presets"
    (click)="isBasemapMenuOpen = !isBasemapMenuOpen"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-6 w-6"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M12 3v1.5M12 19.5V21M4.5 12H3m18 0h-1.5M5.6 5.6l1.06 1.06m10.68 10.68l1.06 1.06M18.4 5.6l-1.06 1.06M7.7 16.7l-1.06 1.06M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"
      />
    </svg>
  </button>
  <div
    *ngIf="isBasemapMenuOpen"
    class="mt-1.5 flex flex-row overflow-hidden rounded shadow"
  >
    <button
      *ngFor="let preset of basemapPresets"
      type="button"
      class="
        bg-white
        px-2
        py-1.5
        text-xs
        font-semibold
        text-gray-800
        hover:bg-gray-200
      "
      [class.bg-gray-300]="currentBasemap === preset.value"
      [attr.aria-pressed]="currentBasemap === preset.value"
      (click)="switchBasemap(preset.value)"
    >
      {{ preset.label }}
    </button>
  </div>
</div>

<!-- //Customizing Mapbox attribution -->
<div class="mapboxgl-ctrl-bottom-right hidden md:block">
  <div class="mapboxgl-ctrl mapboxgl-ctrl-attrib">
    <button
      class="mapboxgl-ctrl-attrib-button"
      type="button"
      title="Toggle attribution"
      aria-label="Toggle attribution"
    ></button>
    <div class="mapboxgl-ctrl-attrib-inner text-black" role="list">
      <a
        href="https://www.mapbox.com/about/maps/"
        target="_blank"
        title="Mapbox"
        class="mr-1 text-black"
        aria-label="Mapbox"
        role="listitem"
        >© Mapbox</a
      >
      <a
        href="http://www.openstreetmap.org/about/"
        target="_blank"
        title="OpenStreetMap"
        class="mr-1 text-black"
        aria-label="OpenStreetMap"
        role="listitem"
        >© OpenStreetMap</a
      >
      <a
        href="https://doh.gov.ph/"
        target="_blank"
        title="OpenStreetMap"
        aria-label="DOH"
        class="mr-1 text-black"
        role="listitem"
        >© Department of Health</a
      >
      <a
        href="https://www.mapbox.com/map-feedback/"
        target="_blank"
        title="Improve this map"
        class="text-black"
        aria-label="Improve this map"
        role="listitem"
        >Improve this map
      </a>
    </div>
  </div>
</div>
