<div id="map"></div>
<canvas #windCanvas id="wind-canvas"></canvas>

<div class="measurements-wrapper">
  <div id="distance" class="distance-container"></div>
  <div id="area" class="area-container"></div>
</div>
<pre id="coordinates" class="coords"></pre>

<div
  id="graph-dom"
  hidden
  class="
    relative
    overflow-hidden
    z-100
    text-left
    w-full
    h-auto
    sm:w-[600px] sm:h-[300px]
    lg:w-[950px] lg:h-[450px]
  "
  style="-webkit-tap-highlight-color: rgba(0, 0, 0, 0); user-select: none"
></div>

<!-- Map controls: the floating toolbar on the right edge of the map and the
     map style / lighting panel in the bottom-right corner. Shared with the
     weather updates and know-your-hazards maps. -->
<noah-map-controls
  [map]="map"
  [selectedStyle]="mapStyle"
  (selectedStyleChange)="switchMapStyle($event)"
  [draw]="draw"
  [geolocateControl]="geolocateControl"
></noah-map-controls>

<!-- Map attribution: the shared credits of every NOAH map, in the
     bottom-right corner of the map. -->
<noah-map-attribution
  [map]="map"
  [bottomOffset]="attributionBottomOffset"
  [maxWidth]="attributionMaxWidth"
></noah-map-attribution>
