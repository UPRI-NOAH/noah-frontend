<div class="absolute top-0 left-0 w-full h-full" id="map-kyh"></div>

<!-- Map controls: the floating toolbar on the right edge of the map and the
     map style / lighting panel in the bottom-right corner. Shared with the
     playground and weather-updates maps. -->
<noah-map-controls
  [map]="map"
  [selectedStyle]="mapStyle"
  (selectedStyleChange)="switchMapStyle($event)"
  [geolocateControl]="geolocateControl"
></noah-map-controls>
<pre id="coordinates" class="coords"></pre>

<div class="md:hidden flex items-center absolute w-full space-x-2 p-2 top-0">
  <!-- Back Button -->
  <button
    routerLink="/"
    class="
      w-10
      h-10
      rounded-full
      bg-white
      flex
      items-center
      justify-center
      shadow
    "
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-5 w-5"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M10 19l-7-7m0 0l7-7m-7 7h18"
      />
    </svg>
  </button>

  <!-- Search Input Container -->
  <div class="flex items-center bg-white rounded-full shadow flex-1 max-w-3xl">
    <noah-search
      [searchTerm]="currentLocation$ | async"
      (selectPlace)="selectPlace($event)"
      class="flex-1"
    >
    </noah-search>
  </div>
</div>

<!-- Hazard level legend: compact, collapsible, top-left -->
<div class="kyh-hazard-legend hidden md:block" [class.is-collapsed]="btnLegend">
  <div class="kyh-hazard-legend__header" (click)="openLegend()">
    <span class="kyh-hazard-legend__title">Hazard level</span>
    <button
      class="kyh-hazard-legend__toggle"
      type="button"
      [attr.aria-expanded]="!btnLegend"
      aria-label="Toggle hazard legend"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline *ngIf="!btnLegend" points="6 9 12 15 18 9"></polyline>
        <polyline *ngIf="btnLegend" points="18 15 12 9 6 15"></polyline>
      </svg>
    </button>
  </div>
  <div class="kyh-hazard-legend__body" *ngIf="kyhLegend">
    <div class="kyh-hazard-legend__item">
      <span
        class="kyh-hazard-legend__swatch kyh-hazard-legend__swatch--low"
      ></span>
      <span class="kyh-hazard-legend__label">Low</span>
    </div>
    <div class="kyh-hazard-legend__item">
      <span
        class="kyh-hazard-legend__swatch kyh-hazard-legend__swatch--medium"
      ></span>
      <span class="kyh-hazard-legend__label">Medium</span>
    </div>
    <div class="kyh-hazard-legend__item">
      <span
        class="kyh-hazard-legend__swatch kyh-hazard-legend__swatch--high"
      ></span>
      <span class="kyh-hazard-legend__label">High</span>
    </div>
  </div>
</div>
