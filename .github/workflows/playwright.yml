name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Live checks against the real Mapbox / NOAH APIs, every day at 06:00 PHT.
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Hermetic suite: every external API is mocked (tests/support/network.ts).
    if: github.event_name != 'schedule'
    name: e2e (${{ matrix.project }})
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome, mobile-safari]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: |
          case "${{ matrix.project }}" in
            mobile-chrome) browser=chromium ;;
            mobile-safari) browser=webkit ;;
            *) browser=${{ matrix.project }} ;;
          esac
          npx playwright install --with-deps "$browser"
      - name: Type-check tests
        run: npm run test:e2e:typecheck
      - name: Production build (same as deploy workflows)
        run: npm run build -- --configuration production
      - name: Build bundle for e2e
        run: npm run e2e:build
      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }}
        env:
          E2E_SKIP_BUILD: '1'
      # Markdown summary (tests/support/markdown-reporter.ts); also shown on the job page.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-report-md-${{ matrix.project }}
          path: test-results/e2e-report.md
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 7

  live:
    # Contract checks against production services (token, static data, site).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run live checks
        run: npm run test:e2e:live
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-live
          path: playwright-report/
          retention-days: 30
